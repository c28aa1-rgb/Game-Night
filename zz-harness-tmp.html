<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hitster harness</title>
  <style>
/* ==========================================================================
   ARCTIC FROST — shared design tokens

   Adapted from the theme-factory preset of the same name. The preset defines
   four colours and no state colours, so a warm amber (steals) and a brick red
   (wrong answers) are added here; everything else is the preset's palette.
   Its DejaVu Sans pairing is a PDF-safe stack rather than a web font, so it is
   substituted with Space Grotesk / Outfit / DM Mono.

   Tokens are semantic, so retheming means editing only this :root block.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  /* Surfaces --------------------------------------------------------------- */
  --bg: #f4f8fd;
  --surface: #ffffff;
  --surface-hi: #e2ecf9;
  --line: rgba(27, 42, 63, 0.14);
  --line-strong: rgba(27, 42, 63, 0.28);

  /* Ink -------------------------------------------------------------------- */
  --text: #1b2a3f;
  --muted: #64789a;

  /* Accents ---------------------------------------------------------------- */
  --accent: #4a6fa5;
  --accent-dim: #35527c;
  --accent-glow: rgba(74, 111, 165, 0.28);

  --accent-2: #e08a3c;
  --accent-2-glow: rgba(224, 138, 60, 0.32);

  --danger: #c4453d;
  --danger-glow: rgba(196, 69, 61, 0.28);

  /* Text that sits on top of a filled accent. */
  --on-accent: #ffffff;
  --on-accent-2: #2e1a06;
  --on-danger: #ffffff;

  /* The disc, and the scrim behind full-screen overlays. */
  --disc-1: #ffffff;
  --disc-2: #d4e4f7;
  --disc-3: #a9bdd6;
  --scrim: rgba(244, 248, 253, 0.93);

  /* Type ------------------------------------------------------------------- */
  --font-display: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  /* Motion ----------------------------------------------------------------- */
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

  /* Rhythm ----------------------------------------------------------------- */
  --radius: 12px;
  --radius-lg: 20px;
}

* {
  box-sizing: border-box;
}

/*
 * The browser's own [hidden] rule lives in the UA stylesheet, which loses to
 * ANY author rule that sets display — including .btn and .dock below. Without
 * this, el.hidden = true silently does nothing to a flex element.
 */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* A cool wash top and bottom, so a large flat screen isn't a slab of white. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(110% 60% at 50% -10%, rgba(74, 111, 165, 0.13), transparent 64%),
    radial-gradient(100% 55% at 50% 112%, rgba(224, 138, 60, 0.10), transparent 68%);
}

/* --------------------------------------------------------------------------
   Type roles
   -------------------------------------------------------------------------- */

.display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.98;
}

.readout {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
}

/* --------------------------------------------------------------------------
   Buttons
   -------------------------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 56px;
  padding: 0 1.5rem;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: transform 140ms var(--spring), box-shadow 180ms var(--ease), background 180ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}

.btn:hover:not(:disabled) {
  box-shadow: 0 0 0 4px var(--accent-glow);
}

.btn:active:not(:disabled) {
  transform: scale(0.97);
}

.btn:disabled {
  background: var(--surface-hi);
  color: var(--muted);
  cursor: not-allowed;
}

.btn--ghost {
  background: var(--surface);
  border-color: var(--line-strong);
  color: var(--text);
}

.btn--ghost:hover:not(:disabled) {
  border-color: var(--accent);
  box-shadow: none;
  color: var(--accent);
}

.btn--danger {
  background: var(--danger);
  color: var(--on-danger);
}

.btn--danger:hover:not(:disabled) {
  box-shadow: 0 0 0 4px var(--danger-glow);
}

.btn--block {
  width: 100%;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

/* --------------------------------------------------------------------------
   Card face
   -------------------------------------------------------------------------- */

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.6rem 0.7rem 0.7rem;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(27, 42, 63, 0.07);
}

.card__year {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--accent);
  line-height: 0.98;
}

.card__title {
  font-weight: 600;
  line-height: 1.25;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.card__artist {
  color: var(--muted);
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --------------------------------------------------------------------------
   Waveform — decorative.

   Spotify's playback stream is DRM-protected, so the Web Audio API cannot tap
   it for real amplitude data. These bars run on randomised cycles while audio
   plays and freeze when it pauses; they are not synced to the actual waveform.
   -------------------------------------------------------------------------- */

.wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 100%;
}

.wave i {
  display: block;
  flex: 0 0 auto;
  width: 3px;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(to top, var(--accent-2), var(--accent));
  transform-origin: center;
  transform: scaleY(0.16);
  animation: wave-bar 900ms ease-in-out infinite alternate;
}

.wave.is-idle i {
  animation-play-state: paused;
  opacity: 0.3;
  transform: scaleY(0.1);
}

@keyframes wave-bar {
  from { transform: scaleY(0.14); }
  to { transform: scaleY(1); }
}

/* --------------------------------------------------------------------------
   Accessibility floor
   -------------------------------------------------------------------------- */

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }

  .wave i { transform: scaleY(0.5); }
}

/* ==========================================================================
   TV view — the shared screen.
   Sized for a living-room display at 2-4 metres.
   ========================================================================== */

.tv {
  min-height: 100vh;
  overflow: hidden;
}

.tv > * {
  position: relative;
  z-index: 1;
}

/* --------------------------------------------------------------------------
   The disc — auth ornament and now-playing spinner.
   Blank while a song is hidden; the reveal drops album art onto it.
   -------------------------------------------------------------------------- */

.record {
  position: relative;
  width: 220px;
  height: 220px;
  flex: 0 0 auto;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(27, 42, 63, 0.06) 0 1px, transparent 1px 5px),
    radial-gradient(circle at 34% 30%, var(--disc-1) 0%, var(--disc-2) 52%, var(--disc-3) 100%);
  box-shadow:
    0 0 0 1px var(--line),
    0 18px 40px rgba(27, 42, 63, 0.18);
  animation: spin 3.4s linear infinite;
}

.record::after {
  content: '';
  position: absolute;
  inset: -18%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-glow), transparent 62%);
  opacity: 0;
  transition: opacity 400ms var(--ease);
  pointer-events: none;
}

.record.is-playing::after {
  opacity: 1;
  animation: halo 2.6s ease-in-out infinite;
}

.record--idle {
  animation-duration: 14s;
  width: 132px;
  height: 132px;
}

.record--paused {
  animation-play-state: paused;
}

.record__label {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 32%;
  height: 32%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow: inset 0 0 0 6px var(--bg), 0 0 26px var(--accent-glow);
}

.record__art {
  position: absolute;
  inset: 12%;
  width: 76%;
  height: 76%;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: inset 0 0 0 2px rgba(27, 42, 63, 0.25);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes halo {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

/* --------------------------------------------------------------------------
   Full-screen gates: auth and lobby
   -------------------------------------------------------------------------- */

.gate {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 4vmin;
  background: var(--bg);
}

/* Declared before the lobby in the markup, but it has to cover it. */
#audio.gate {
  z-index: 25;
}

.gate__inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.1rem;
  max-width: 30rem;
  text-align: center;
}

.gate__title {
  margin: 0;
  font-size: clamp(2.4rem, 5.5vw, 4.2rem);
  color: var(--text);
}

.gate__body {
  margin: 0;
  max-width: 26rem;
  color: var(--muted);
  line-height: 1.6;
}

.gate__error {
  min-height: 1.2rem;
  margin: 0;
  color: var(--danger);
  font-size: 0.9rem;
}

/* --------------------------------------------------------------------------
   Lobby
   -------------------------------------------------------------------------- */

.lobby {
  display: grid;
  grid-template-columns: minmax(280px, 26rem) 1fr;
  gap: clamp(2rem, 6vw, 6rem);
  align-items: center;
  width: min(1200px, 92vw);
}

.lobby__code {
  margin: 0.2rem 0 1.6rem;
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: clamp(2.8rem, 6.5vw, 4.6rem);
  letter-spacing: 0.2em;
  color: var(--accent);
  text-shadow: 0 0 44px var(--accent-glow);
}

.qr {
  display: inline-block;
  padding: 12px;
  background: var(--text);
  border-radius: var(--radius);
  line-height: 0;
}

.qr img {
  display: block;
  width: clamp(150px, 15vw, 210px);
  height: auto;
}

.lobby__url {
  margin: 0.9rem 0 0;
  word-break: break-all;
  font-size: 0.7rem;
}

.lobby__wordmark {
  margin: 0;
  font-size: clamp(3.2rem, 8.5vw, 7rem);
  color: var(--text);
}

.lobby__wordmark::after {
  content: '';
  display: block;
  width: 100%;
  height: 3px;
  margin-top: 0.5rem;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
}

.lobby__tag {
  margin: 1rem 0 2.4rem;
  max-width: 34rem;
  font-size: clamp(1rem, 1.5vw, 1.25rem);
  color: var(--muted);
  line-height: 1.6;
}

.lobby__players-label { display: block; margin-bottom: 0.8rem; }

.lobby__players {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin: 0;
  padding: 0;
  list-style: none;
  min-height: 3rem;
}

.lobby__player {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1.1rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
  animation: pop 420ms var(--spring) both;
}

.lobby__player--host { border-color: var(--accent); }

.lobby__player--host::after {
  content: 'host';
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}

.lobby__hint {
  margin: 2rem 0 0;
  color: var(--muted);
  font-size: 0.95rem;
}

@keyframes pop {
  from { opacity: 0; transform: translateY(10px) scale(0.94); }
  to { opacity: 1; transform: none; }
}

/* --------------------------------------------------------------------------
   Game stage
   -------------------------------------------------------------------------- */

.stage {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: clamp(0.8rem, 2vh, 2rem);
  height: 100vh;
  padding: clamp(1rem, 2.4vh, 2rem) clamp(1.5rem, 3vw, 3.5rem);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  /* A nowrap row's minimum width is the sum of its children, and a grid item
     cannot be narrower than that — so on a small screen this row alone would
     set the width of the whole stage and push everything else off the side.
     Wrapping lets it give way instead. */
  flex-wrap: wrap;
}

.topbar__mark {
  font-size: clamp(1.3rem, 2vw, 1.9rem);
  color: var(--accent);
}

.topbar__meta {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-size: 0.8rem;
}

.topbar__dot { color: var(--line-strong); }

.topbar__turn {
  color: var(--text);
  letter-spacing: 0.14em;
}

/* The active-set tag in the topbar. Pushed right, and the first thing to take
   the leftover space — the volume slider follows it. */
.setstag {
  display: inline-flex;
  align-items: baseline;
  gap: 0.5rem;
  margin-left: auto;
  min-height: 34px;
  padding: 0 0.9rem;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--font-ui);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 160ms var(--ease), color 160ms var(--ease);
}

.setstag:hover,
.setstag:focus-visible {
  border-color: var(--accent);
  color: var(--text);
  outline: none;
}

.setstag__n {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--accent);
  letter-spacing: 0.06em;
}

/* The same information in the lobby, where there is room to spell it out. */
.setsline {
  margin-top: 1.6rem;
  padding-top: 1.3rem;
  border-top: 1px solid var(--line);
}

.setsline__row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.6rem;
}

.setsline__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.setsline__chip {
  padding: 0.35rem 0.85rem;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--surface-hi);
  color: var(--accent);
  font-size: 0.95rem;
  font-weight: 600;
}

.setsline__chip--none {
  border-color: var(--danger);
  color: var(--danger);
  background: var(--surface);
}

.setsline__edit {
  padding: 0.35rem 0.85rem;
  border: 1px dashed var(--line-strong);
  border-radius: 999px;
  background: none;
  color: var(--muted);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 160ms var(--ease), color 160ms var(--ease);
}

.setsline__edit:hover,
.setsline__edit:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}

.setsline__count {
  margin: 0.7rem 0 0;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.volume {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  opacity: 0.55;
  transition: opacity 200ms var(--ease);
}

.volume:hover, .volume:focus-within { opacity: 1; }

.volume input[type='range'] {
  width: 120px;
  height: 3px;
  appearance: none;
  background: var(--line-strong);
  border-radius: 999px;
  cursor: pointer;
}

.volume input[type='range']::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
}

.volume input[type='range']::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
}

.tv-reset {
  min-height: 34px;
  padding: 0 0.9rem;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: rgb(255 255 255 / 0.04);
  color: var(--muted);
  font-family: var(--font-ui);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 160ms var(--ease), color 160ms var(--ease), background 160ms var(--ease);
}

.tv-reset:hover,
.tv-reset:focus-visible {
  border-color: var(--danger);
  background: rgb(200 53 43 / 0.16);
  color: var(--text);
  outline: none;
}

/* --------------------------------------------------------------------------
   Now playing
   -------------------------------------------------------------------------- */

.nowplaying {
  display: flex;
  align-items: center;
  gap: clamp(1.5rem, 3vw, 3rem);
}

.nowplaying .record {
  width: clamp(110px, 12vh, 170px);
  height: clamp(110px, 12vh, 170px);
}

.nowplaying__text {
  min-width: 0;
  flex: 1;
}

.nowplaying__title {
  margin: 0.3rem 0 0.35rem;
  font-size: clamp(1.6rem, 3.4vw, 3.1rem);
  color: var(--text);
}

.nowplaying__title.is-hidden-track {
  color: var(--muted);
  letter-spacing: 0.06em;
}

.nowplaying__sub {
  margin: 0 0 1rem;
  color: var(--muted);
  font-size: clamp(0.85rem, 1.1vw, 1rem);
}

/* Waveform sits where a spectrum analyser would on a hi-fi. */
.nowplaying__wave {
  width: min(560px, 100%);
  height: clamp(38px, 6vh, 64px);
  margin-bottom: 0.7rem;
}

.progress {
  width: min(560px, 100%);
  height: 4px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.progress__fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  border-radius: 999px;
  transition: width 300ms linear;
}

.nowplaying__time { margin: 0.5rem 0 0; }

/* --------------------------------------------------------------------------
   THE RAIL — signature element.
   A lit track running edge to edge with cards hanging beneath it on
   drop-lines and years set above.
   -------------------------------------------------------------------------- */

/*
 * --tscale shrinks the whole timeline as it fills up.
 *
 * At full size a 10-card timeline wants around 130% of the width it has, so
 * the last few cards used to slide off behind a scrollbar — on a screen whose
 * entire job is showing the timeline at a glance. Every dimension below is
 * expressed as a fraction of this one number, so fitGroove() can measure the
 * overflow once and shrink the row to fit without anything drifting out of
 * proportion with anything else.
 */
.groove-wrap {
  --tscale: 1;
  --year-h: calc(62px * var(--tscale));
  --band-h: calc(22px * var(--tscale));
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  /*
   * Without this the row does not scroll — it widens. A grid item's automatic
   * minimum size is its content, so a long timeline pushed this wrapper past
   * its track and stretched the whole stage with it: the topbar, the player
   * bar and the now-playing block all went with it. min-width: 0 is what makes
   * the overflow belong to .groove-scroll, which is the only thing that should
   * ever be wider than the screen.
   */
  min-width: 0;
}

.groove-owner {
  margin: 0 0 0.6rem;
  color: var(--accent);
}

.groove-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
  padding-bottom: 0.5rem;
}

.groove-scroll::-webkit-scrollbar { height: 6px; }
.groove-scroll::-webkit-scrollbar-track { background: transparent; }
.groove-scroll::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 999px;
}

.groove {
  position: relative;
  min-width: 100%;
  width: max-content;
  padding: 0 calc(1.5rem * var(--tscale));
}

.groove__surface {
  position: absolute;
  top: var(--year-h);
  left: 0;
  right: 0;
  height: var(--band-h);
  background: linear-gradient(to bottom, var(--surface-hi), var(--surface));
  border-top: 2px solid var(--accent);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 4px 18px var(--accent-glow);
  overflow: hidden;
}

/* A light sweeping the rail. */
.groove__surface::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 30%;
  background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
  animation: sheen 6s linear infinite;
}

@keyframes sheen {
  from { left: -40%; }
  to { left: 110%; }
}

.groove__cards {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: calc(clamp(0.7rem, 1.4vw, 1.4rem) * var(--tscale));
}

.tcard {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: calc(clamp(112px, 11vw, 168px) * var(--tscale));
  flex: 0 0 auto;
  scroll-snap-align: center;
  animation: card-land 520ms var(--spring) both;
}

.tcard__year {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  height: var(--year-h);
  font-family: var(--font-display);
  font-size: calc(clamp(1.3rem, 2vw, 2rem) * var(--tscale));
  color: var(--accent);
  line-height: 1;
  padding-bottom: calc(0.3rem * var(--tscale));
}

.tcard__node {
  position: relative;
  height: var(--band-h);
  width: 100%;
}

.tcard__node::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 9px;
  height: 9px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

.tcard__drop {
  width: 1px;
  height: calc(28px * var(--tscale));
  background: linear-gradient(to bottom, var(--accent), var(--line));
}

.tcard__body {
  width: 100%;
  min-height: calc(76px * var(--tscale));
  padding: calc(0.6rem * var(--tscale)) calc(0.7rem * var(--tscale)) calc(0.7rem * var(--tscale));
  transition: transform 260ms var(--spring), border-color 260ms var(--ease);
  transform-origin: top center;
}

.tcard__body:hover {
  transform: perspective(700px) rotateX(7deg) translateY(-3px);
  border-color: var(--line-strong);
}

.tcard .card__title { font-size: calc(clamp(0.75rem, 0.85vw, 0.92rem) * var(--tscale)); }
.tcard .card__artist {
  font-size: calc(clamp(0.68rem, 0.75vw, 0.8rem) * var(--tscale));
  margin-top: calc(0.2rem * var(--tscale));
}
.tcard .card__title, .tcard .card__artist { margin-block: 0; }

/* The card that just landed: drops in from the rail and glows. */
.tcard--new {
  animation: card-slam 700ms var(--spring) both;
}

.tcard--new .tcard__body {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 34px var(--accent-glow);
}

@keyframes card-land {
  from { opacity: 0; transform: translateY(-18px); }
  to { opacity: 1; transform: none; }
}

@keyframes card-slam {
  0% { opacity: 0; transform: translateY(-140px) scale(1.12) rotate(-5deg); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}

.groove__empty {
  padding: calc(var(--year-h) + var(--band-h) + 2rem) 0 2rem;
  color: var(--muted);
  font-size: 0.95rem;
}

/* --------------------------------------------------------------------------
   Player bar
   -------------------------------------------------------------------------- */

/* Read from across the room, so the scores are sized for a couch rather than a
   desk — roughly two and a half times the old pill. */
.playerbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: clamp(0.7rem, 1.6vw, 1.6rem);
  padding-top: 0.6rem;
  border-top: 1px solid var(--line);
}

.pplayer {
  display: flex;
  align-items: baseline;
  gap: 1.1rem;
  padding: 0.9rem 2rem;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  transition: border-color 300ms var(--ease), background 300ms var(--ease);
}

.pplayer__name {
  font-weight: 600;
  font-size: clamp(1.6rem, 2.4vw, 2.6rem);
  line-height: 1.1;
}

.pplayer__count {
  font-family: var(--font-display);
  font-size: clamp(2rem, 3vw, 3.4rem);
  color: var(--accent);
  line-height: 1;
}

.pplayer--active {
  border-color: var(--accent);
  background: var(--surface-hi);
  animation: breathe 2.6s ease-in-out infinite;
}

.pplayer--active .pplayer__name { color: var(--accent); }

.pplayer--offline { opacity: 0.38; }

.pplayer--blocked .pplayer__name { text-decoration: line-through; }

/* One card from winning. Amber rather than the usual blue, and a ring that
   keeps expanding out of the pill so it catches the eye from across a room. */
.pplayer--matchpoint {
  position: relative;
  border-color: var(--accent-2);
  background: var(--surface);
}

.pplayer--matchpoint .pplayer__name,
.pplayer--matchpoint .pplayer__count { color: var(--accent-2); }

.pplayer--matchpoint::after {
  content: '';
  position: absolute;
  inset: -3px;
  border: 2px solid var(--accent-2);
  border-radius: 999px;
  pointer-events: none;
  animation: matchpulse 1.7s var(--ease) infinite;
}

.pplayer__flag {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--on-accent-2);
  background: var(--accent-2);
  padding: 0.2rem 0.5rem;
  border-radius: 999px;
  white-space: nowrap;
}

@keyframes matchpulse {
  0% { opacity: 0.85; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.22); }
}

@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 transparent; }
  50% { box-shadow: 0 0 24px 2px var(--accent-glow); }
}

/* --------------------------------------------------------------------------
   Overlays
   -------------------------------------------------------------------------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 4vmin;
  background: var(--scrim);
  backdrop-filter: blur(14px);
  animation: fade 240ms var(--ease) both;
}

.overlay__inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.4rem;
  text-align: center;
  max-width: 46rem;
}

.overlay__headline {
  margin: 0;
  font-size: clamp(2rem, 5.5vw, 4.6rem);
  color: var(--text);
}

.overlay__headline--good { color: var(--accent); }
.overlay__headline--bad { color: var(--danger); }

.overlay__sub {
  margin: 0;
  font-size: clamp(1rem, 1.6vw, 1.3rem);
  color: var(--muted);
  line-height: 1.6;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Reveal card: face-down, then flips to the year. */
.flip {
  width: clamp(200px, 22vw, 280px);
  height: clamp(270px, 30vw, 380px);
  perspective: 1400px;
}

.flip__inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 900ms var(--spring);
}

.flip.is-flipped .flip__inner { transform: rotateY(180deg); }

/* Once the year is read, the whole card flies off toward the rail. */
.flip.is-departing {
  animation: card-depart 620ms var(--ease) both;
}

@keyframes card-depart {
  to { opacity: 0; transform: translateY(46vh) scale(0.42); }
}

.flip__face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  padding: 1.4rem;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line-strong);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.flip__face {
  box-shadow: 0 14px 40px rgba(27, 42, 63, 0.16);
}

.flip__face--front {
  background:
    repeating-linear-gradient(135deg, rgba(74, 111, 165, 0.09) 0 3px, transparent 3px 10px),
    linear-gradient(160deg, var(--surface), var(--surface-hi));
}

.flip__face--front span {
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 5vw, 4.2rem);
  color: var(--accent);
  opacity: 0.4;
}

.flip__face--back {
  transform: rotateY(180deg);
  background: var(--surface);
}

.flip__art {
  width: 42%;
  aspect-ratio: 1;
  border-radius: 6px;
  object-fit: cover;
}

.flip__year {
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 5.5vw, 4.4rem);
  line-height: 0.95;
  color: var(--accent);
}

.flip__title {
  margin: 0;
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.3;
}

.flip__artist {
  margin: 0;
  color: var(--muted);
  font-size: 0.9rem;
}

.flip--good .flip__face--back {
  border-color: var(--accent);
  box-shadow: 0 0 50px var(--accent-glow);
}

.flip--bad .flip__face--back {
  border-color: var(--danger);
  box-shadow: 0 0 50px var(--danger-glow);
}

.flip--bad { animation: shake 480ms var(--ease) 900ms both; }

@keyframes shake {
  10%, 90% { transform: translateX(-4px); }
  20%, 80% { transform: translateX(7px); }
  30%, 50%, 70% { transform: translateX(-11px); }
  40%, 60% { transform: translateX(11px); }
  100% { transform: none; }
}

/* --------------------------------------------------------------------------
   Steal clock — sits under the now-playing block during a song.
   -------------------------------------------------------------------------- */

/*
 * Parked on the right of the now-playing row. The left column already carries
 * the disc, the title, the waveform and the progress bar; hanging a countdown
 * off the bottom of that stack made it a wall.
 */
.stealclock {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 0.35rem;
  margin-left: auto;
  padding-left: clamp(1rem, 3vw, 3rem);
  flex: 0 0 auto;
  text-align: right;
}

.stealclock__label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.stealclock__value {
  font-family: var(--font-display);
  /* Room to be big now that it has its own column. */
  font-size: clamp(2.6rem, 6vw, 5rem);
  line-height: 0.9;
  color: var(--muted);
  transition: color 200ms var(--ease);
  font-variant-numeric: tabular-nums;
}

/* Once stealing is live the whole block switches on. */
.stealclock--open .stealclock__label { color: var(--accent-2); }

.stealclock--open .stealclock__value {
  /* A word, not a number — it doesn't need the same weight as a countdown. */
  font-size: clamp(1.6rem, 3vw, 2.6rem);
  letter-spacing: 0.04em;
  color: var(--accent-2);
  animation: steal-live 1.8s ease-in-out infinite;
}

@keyframes steal-live {
  0%, 100% { opacity: 0.65; }
  50% { opacity: 1; }
}

/* --------------------------------------------------------------------------
   Turn intro — "Alex is up", counting into the next song.
   -------------------------------------------------------------------------- */

.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
}

.intro__who {
  font-family: var(--font-display);
  font-size: clamp(3rem, 10vw, 8rem);
  line-height: 0.95;
  color: var(--accent);
  animation: verdict-in 520ms var(--spring) both;
}

.intro__sub {
  margin: 0;
  font-size: clamp(1rem, 1.6vw, 1.3rem);
  color: var(--muted);
}

.intro__count {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  line-height: 1;
  color: var(--text);
}

/* Each number lands fresh rather than the digit just swapping. */
.intro__count span {
  display: inline-block;
  animation: count-pop 380ms var(--spring) both;
}

@keyframes count-pop {
  from { opacity: 0; transform: scale(1.8); }
  to { opacity: 1; transform: none; }
}

/* --------------------------------------------------------------------------
   Answer countdown — the 6 seconds a stealer gets.
   -------------------------------------------------------------------------- */

.answerclock {
  position: relative;
  width: clamp(120px, 16vw, 190px);
  height: clamp(120px, 16vw, 190px);
}

.answerclock svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.answerclock__track { stroke: var(--line); }

.answerclock__ring {
  stroke: var(--accent-2);
  stroke-linecap: round;
  /* Circumference of r=54; the dash offset is driven from JS each frame. */
  stroke-dasharray: 339.29;
  transition: stroke 200ms var(--ease);
}

.answerclock--urgent .answerclock__ring { stroke: var(--danger); }

.answerclock__value {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 5vw, 4rem);
  color: var(--text);
}

.answerclock--urgent .answerclock__value {
  color: var(--danger);
  animation: urgent-pulse 500ms ease-in-out infinite;
}

@keyframes urgent-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

/* Steal overlay */

.steal-mark {
  font-family: var(--font-display);
  font-size: clamp(3rem, 9vw, 7.5rem);
  line-height: 0.95;
  color: var(--accent-2);
  text-shadow: 0 0 50px var(--accent-2-glow);
  animation: slam 420ms var(--spring) both;
}

@keyframes slam {
  from { opacity: 0; transform: scale(1.6); }
  to { opacity: 1; transform: none; }
}

/* --------------------------------------------------------------------------
   Steal verdict — the loudest moment in the game, so it gets the screen.
   -------------------------------------------------------------------------- */

.verdict {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
}

.verdict__word {
  font-family: var(--font-display);
  font-size: clamp(3.5rem, 14vw, 12rem);
  line-height: 0.9;
  letter-spacing: -0.03em;
}

.verdict--good .verdict__word {
  color: var(--accent);
  text-shadow: 0 0 70px var(--accent-glow);
  animation: verdict-in 560ms var(--spring) both;
}

.verdict--bad .verdict__word {
  color: var(--danger);
  text-shadow: 0 0 70px var(--danger-glow);
  animation: verdict-in 380ms var(--spring) both, verdict-shake 460ms var(--ease) 380ms both;
}

.verdict__who {
  font-size: clamp(1.1rem, 2.4vw, 2rem);
  font-weight: 600;
  animation: verdict-rise 460ms var(--ease) 220ms both;
}

.verdict__note {
  margin: 0;
  color: var(--muted);
  font-size: clamp(0.9rem, 1.4vw, 1.15rem);
  animation: verdict-rise 460ms var(--ease) 340ms both;
}

@keyframes verdict-in {
  0% { opacity: 0; transform: scale(2.2) rotate(-6deg); }
  70% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}

@keyframes verdict-rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

@keyframes verdict-shake {
  10%, 90% { transform: translateX(-8px); }
  20%, 80% { transform: translateX(12px); }
  30%, 50%, 70% { transform: translateX(-18px); }
  40%, 60% { transform: translateX(18px); }
  100% { transform: none; }
}

/* Rays that punch outward on a successful steal. */
.verdict__burst {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: repeating-conic-gradient(
    from 0deg at 50% 50%,
    var(--accent-glow) 0deg 6deg,
    transparent 6deg 18deg
  );
  opacity: 0;
  animation: burst 900ms var(--ease) both;
}

@keyframes burst {
  0% { opacity: 0.85; transform: scale(0.3) rotate(0deg); }
  100% { opacity: 0; transform: scale(2.2) rotate(38deg); }
}

/* Winner */

.winner-name {
  font-family: var(--font-display);
  font-size: clamp(3rem, 10vw, 8rem);
  line-height: 0.95;
  color: var(--accent);
  text-shadow: 0 0 60px var(--accent-glow);
}

/* --------------------------------------------------------------------------
   Winning
   -------------------------------------------------------------------------- */

/* The confetti canvas covers the whole screen and must never eat a click —
   the host still needs the phone-driven controls to work under it. */
.confetti {
  position: fixed;
  inset: 0;
  z-index: 60;
  pointer-events: none;
}

/* Less blur than the other overlays: the confetti behind the glass is the
   point, so the scrim gets out of its way. */
.overlay--win {
  background: var(--scrim);
  backdrop-filter: blur(6px);
}

.win {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.9rem;
}

.win__trophy {
  margin: 0;
  font-size: clamp(3rem, 9vw, 7rem);
  line-height: 1;
  filter: drop-shadow(0 0 30px var(--accent-2-glow));
}

.win__score { color: var(--accent-2); }

/* The actual verdict. Tracked out wide so it reads as a statement rather than
   a label, and indented by one tracking step because letter-spacing adds the
   gap after the last letter too, which otherwise sits it off-centre. */
.win__verb {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 4vw, 3.2rem);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: var(--accent-2);
}

/* Staggered so the name lands, then the verdict, then the score — timed with
   the run-up in SFX.victory(). */
.win--enter .win__trophy { animation: trophy-drop 900ms var(--spring) both; }
.win--enter .winner-name { animation: win-pop 700ms var(--spring) 200ms both; }
.win--enter .win__verb { animation: verb-in 620ms var(--ease) 560ms both; }
.win--enter .win__score { animation: win-pop 700ms var(--spring) 900ms both; }
.win--enter .overlay__sub { animation: fade 600ms var(--ease) 1.8s both; }

/* Pulls itself together out of the letter-spacing. */
@keyframes verb-in {
  0% { opacity: 0; letter-spacing: 1.4em; text-indent: 1.4em; }
  100% { opacity: 1; letter-spacing: 0.42em; text-indent: 0.42em; }
}

@keyframes trophy-drop {
  0% { transform: translateY(-60vh) rotate(-25deg); opacity: 0; }
  70% { transform: translateY(0) rotate(6deg); opacity: 1; }
  100% { transform: translateY(0) rotate(0deg); opacity: 1; }
}

@keyframes win-pop {
  0% { transform: scale(0.4); opacity: 0; }
  60% { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* The forfeited card on a failed steal. */
.verdict__forfeit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  margin-top: 1.2rem;
  padding: 0.9rem 1.6rem;
  border: 1px solid var(--danger);
  border-radius: var(--radius);
  background: var(--surface);
  animation: forfeit-in 520ms var(--spring) 400ms both;
}

.verdict__forfeit-tag {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--danger);
}

.verdict__forfeit-year {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 3.4vw, 3rem);
  line-height: 1;
  color: var(--text);
}

.verdict__forfeit-song {
  font-size: clamp(0.9rem, 1.2vw, 1.1rem);
  color: var(--muted);
}

/* Slides up and away, like the card is being pulled off the timeline. */
@keyframes forfeit-in {
  0% { transform: translateY(28px) scale(0.9); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

.booting__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
  justify-content: center;
  margin-top: 0.5rem;
}

/* --------------------------------------------------------------------------
   Song sets panel
   -------------------------------------------------------------------------- */

.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 4vmin;
  background: var(--scrim);
  backdrop-filter: blur(14px);
  animation: fade 180ms var(--ease) both;
}

.sheet__inner {
  display: flex;
  flex-direction: column;
  width: min(64rem, 100%);
  max-height: 88vh;
  padding: clamp(1.4rem, 3vh, 2.4rem);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: 0 30px 90px rgb(0 0 0 / 0.18);
  animation: pop 260ms var(--spring) both;
}

.sheet__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}

.sheet__title {
  margin: 0.2rem 0 0;
  font-size: clamp(1.8rem, 3.4vw, 2.8rem);
}

.sheet__close {
  padding: 0.6rem 1.4rem;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
}

.sheet__close:hover { box-shadow: 0 0 0 4px var(--accent-glow); }

.sheet__lede {
  margin: 0.8rem 0 0;
  max-width: 46rem;
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.6;
}

/* The chip list is the only part allowed to scroll, so the tally and the
   close button never leave the screen on a long catalogue. */
.sheet__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  margin: 1.2rem 0;
  padding-right: 0.4rem;
}

.sheet__group {
  margin: 1.4rem 0 0.7rem;
  color: var(--muted);
}

.sheet__body .sheet__group:first-child { margin-top: 0; }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
}

.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.7rem 1.15rem;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 160ms var(--ease), background 160ms var(--ease), color 160ms var(--ease);
}

.chip:hover:not(:disabled) { border-color: var(--accent); }

.chip[aria-pressed='true'] {
  border-color: var(--accent);
  background: var(--surface-hi);
  color: var(--text);
}

.chip[aria-pressed='true'] .chip__n { color: var(--accent); }

.chip:disabled { opacity: 0.35; cursor: not-allowed; }

.chip__n {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--muted);
}

.sheet__foot {
  padding-top: 1.1rem;
  border-top: 1px solid var(--line);
}

.sheet__tally {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.sheet__tally b { color: var(--accent); font-size: 1.05rem; }
.sheet__tally--thin, .sheet__tally--thin b { color: var(--danger); }

.sheet__note {
  margin: 0.5rem 0 0;
  color: var(--muted);
  font-size: 0.88rem;
}

.sheet__link {
  display: inline-block;
  margin-top: 0.7rem;
  color: var(--accent);
  font-size: 0.88rem;
}

/* --------------------------------------------------------------------------
   Match point announcement
   -------------------------------------------------------------------------- */

/* Above the reveal overlay (30) and the sets panel (40), below the confetti
   (60) — it has to be readable over whatever is already on screen. */
.announce {
  position: fixed;
  z-index: 50;
  top: 6vh;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: baseline;
  gap: 0.7rem;
  padding: 1rem 2.2rem;
  border: 2px solid var(--accent-2);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: 0 18px 60px var(--accent-2-glow);
  white-space: nowrap;
  overflow: hidden;
}

.announce.is-in { animation: announce-in 520ms var(--spring) both; }

.announce__name {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3vw, 2.8rem);
  line-height: 1;
  color: var(--accent-2);
}

.announce__text {
  font-size: clamp(1rem, 1.5vw, 1.4rem);
  color: var(--text);
}

.announce__text strong { color: var(--accent-2); }

/* A single sweep across the banner as it lands. */
.announce__flare {
  position: absolute;
  top: 0;
  bottom: 0;
  /* Parked off the left edge, so it is invisible until the sweep runs. */
  left: -40%;
  width: 40%;
  background: linear-gradient(90deg, transparent, var(--accent-2-glow), transparent);
}

.announce.is-in .announce__flare { animation: sheen 1.5s var(--ease) 320ms; }

@keyframes announce-in {
  0% { opacity: 0; transform: translate(-50%, -140%) scale(0.9); }
  100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

/* Toast */

.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  padding: 0.8rem 1.4rem;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.9rem;
  animation: pop 300ms var(--spring) both;
}

/* --------------------------------------------------------------------------
   Narrow screens
   -------------------------------------------------------------------------- */

@media (max-width: 900px) {
  .lobby { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .lobby__wordmark::after { display: none; }
  .lobby__players { justify-content: center; }
  .nowplaying { flex-direction: column; text-align: center; }
  .progress, .nowplaying__wave { margin-left: auto; margin-right: auto; }
  .stealclock {
    margin-left: 0;
    padding-left: 0;
    align-items: center;
    text-align: center;
  }
}

/* --------------------------------------------------------------------------
   The way out

   A TV screen has no back button, no address bar and nobody sitting in front
   of it — so leaving has to be a thing you can see from the sofa. It holds one
   corner all night at the weight of a footnote, and comes up to full contrast
   only when something is actually pointing at it.

   Bottom left, opposite the room code: the corner the eye goes to last, which
   is exactly right for the control nobody needs until they do.
   -------------------------------------------------------------------------- */

.tv-back {
  position: fixed;
  z-index: 25;
  left: clamp(1rem, 2vw, 2rem);
  bottom: clamp(0.9rem, 2vh, 1.6rem);
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 34px;
  padding: 0 0.9rem 0 0.75rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgb(255 255 255 / 0.55);
  backdrop-filter: blur(8px);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-decoration: none;
  opacity: 0.62;
  transition: opacity 180ms var(--ease), color 180ms var(--ease),
    border-color 180ms var(--ease);
}

.tv-back:hover,
.tv-back:focus-visible {
  opacity: 1;
  color: var(--accent);
  border-color: var(--accent);
}

.tv-back__arrow {
  font-family: var(--font-body);
  font-size: 0.95rem;
  line-height: 1;
  transition: transform 180ms var(--spring);
}

.tv-back:hover .tv-back__arrow,
.tv-back:focus-visible .tv-back__arrow { transform: translateX(-3px); }

/* The player strip runs to the foot of the stage; give the corner back. */
.playerbar { padding-bottom: 2.6rem; }

@media (min-width: 1100px) {
  .playerbar { padding-bottom: 0; padding-left: 11rem; padding-right: 11rem; }
}

@media (prefers-reduced-motion: reduce) {
  .tv-back__arrow { transition: none; }
  .tv-back:hover .tv-back__arrow,
  .tv-back:focus-visible .tv-back__arrow { transform: none; }
}

</style>
</head>
<body class="tv">

  <main id="game" class="stage">

    <header class="topbar">
      <span class="display topbar__mark">Hitster</span>
      <span class="topbar__meta readout">
        <span id="round-label">Round 14</span>
        <span class="topbar__dot">·</span>
        <span id="turn-label" class="topbar__turn">Alexandra's turn</span>
      </span>
      <button id="topbar-sets" class="setstag" type="button" title="Which song sets are switched on">
        <span class="setstag__label" id="topbar-sets-label">Pop</span>
        <span class="setstag__n" id="topbar-sets-count">1284</span>
      </button>
      <div class="volume">
        <span class="eyebrow">Vol</span>
        <input id="volume" type="range" min="0" max="100" value="60" aria-label="Playback volume" />
      </div>
      <button id="new-room-btn" class="tv-reset" type="button">New room</button>
    </header>

    <section class="nowplaying">
      <div id="disc" class="record" aria-hidden="true">
        <span class="record__label"></span>
      </div>
      <div class="nowplaying__text">
        <p class="eyebrow" id="np-eyebrow">Now playing</p>
        <p class="display nowplaying__title" id="np-title">??? — ?????</p>
        <p class="nowplaying__sub" id="np-sub">Nobody knows the year yet.</p>
        <div class="nowplaying__wave" aria-hidden="true">
          <div class="wave is-idle" id="wave"></div>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
        <p class="readout nowplaying__time"><span id="np-elapsed">1:12</span></p>
      </div>
      <div class="stealclock" id="steal-clock" hidden>
        <span class="stealclock__label" id="steal-clock-label">Steals open in</span>
        <span class="stealclock__value" id="steal-clock-value">10</span>
      </div>
    </section>

    <section class="groove-wrap" aria-label="Timeline">
      <p class="eyebrow groove-owner"><span id="groove-owner-name">Alexandra</span>'s timeline</p>
      <div class="groove-scroll" id="groove-scroll">
        <div class="groove" id="groove">
          <div class="groove__surface" aria-hidden="true"></div>
          <div class="groove__cards" id="groove-cards"></div>
        </div>
      </div>
    </section>

    <footer class="playerbar" id="playerbar"></footer>
  </main>

<script>
const el = (id) => document.getElementById(id);

const CARDS = [
  { year: 1967, title: 'Everything I Wanted (feat. Somebody Else)', artist: 'The Extremely Long Band Name Orchestra' },
  { year: 1972, title: 'Superstition', artist: 'Stevie Wonder' },
  { year: 1979, title: 'Heart of Glass', artist: 'Blondie' },
  { year: 1984, title: 'When Doves Cry', artist: 'Prince' },
  { year: 1991, title: 'Smells Like Teen Spirit', artist: 'Nirvana' },
  { year: 1997, title: 'Bitter Sweet Symphony', artist: 'The Verve' },
  { year: 2003, title: 'Crazy in Love (feat. Jay-Z)', artist: 'Beyoncé' },
  { year: 2009, title: 'Empire State of Mind', artist: 'Jay-Z & Alicia Keys' },
  { year: 2014, title: 'Uptown Funk (feat. Bruno Mars)', artist: 'Mark Ronson' },
  { year: 2019, title: 'Everything I Wanted', artist: 'Billie Eilish' },
];

const PLAYERS = ['Alexandra', 'Christopher', 'Bo', 'Danielle', 'Emmanuel'];

function renderGroove() {
  const container = el('groove-cards');
  container.innerHTML = '';
  CARDS.forEach((card) => {
    const item = document.createElement('article');
    item.className = 'tcard';
    item.innerHTML = `
      <span class="tcard__year">${card.year}</span>
      <span class="tcard__node"></span>
      <span class="tcard__drop"></span>
      <div class="tcard__body card">
        <p class="card__title">${card.title}</p>
        <p class="card__artist">${card.artist}</p>
      </div>`;
    container.appendChild(item);
  });
  fitGroove();
}

function renderPlayerBar() {
  const bar = el('playerbar');
  bar.innerHTML = '';
  PLAYERS.forEach((name, i) => {
    const pill = document.createElement('div');
    pill.className = `pplayer${i === 0 ? ' pplayer--active' : ''}`;
    pill.innerHTML = `<span class="pplayer__name">${name}</span><span class="pplayer__count">${10 - i}</span>`;
    bar.appendChild(pill);
  });
}

// --- verbatim copy of tv.js fitGroove() -----------------------------------
function fitGroove() {
  const wrap = document.querySelector('.groove-wrap');
  const scroll = el('groove-scroll');
  const groove = el('groove');
  if (!wrap || !scroll || !groove) return;
  wrap.style.setProperty('--tscale', '1');
  const available = scroll.clientWidth;
  const needed = groove.scrollWidth;
  if (!available || !needed) return;
  const scale = (available - 4) / needed;
  const FLOOR = 0.55;
  wrap.style.setProperty('--tscale', String(Math.max(FLOOR, Math.min(1, scale))));
}

function buildWave(node, count) {
  node.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const bar = document.createElement('i');
    bar.style.animationDuration = `${420 + Math.random() * 640}ms`;
    node.appendChild(bar);
  }
}

buildWave(el('wave'), 56);
renderPlayerBar();
renderGroove();
window.addEventListener('resize', renderGroove);

// --- measurement ----------------------------------------------------------
window.M = function () {
  const wrap = document.querySelector('.groove-wrap');
  const scroll = el('groove-scroll');
  const groove = el('groove');
  const sr = scroll.getBoundingClientRect();
  const bodies = [...document.querySelectorAll('.tcard__body')];

  const cards = bodies.map((b) => {
    const t = b.querySelector('.card__title');
    const a = b.querySelector('.card__artist');
    const br = b.getBoundingClientRect();
    const ar = a.getBoundingClientRect();
    return {
      bodyH: +br.height.toFixed(1),
      bodyBottom: +br.bottom.toFixed(1),
      bodyScrollH: b.scrollHeight,
      bodyClientH: b.clientHeight,
      titleH: +t.getBoundingClientRect().height.toFixed(1),
      titleScrollH: t.scrollHeight,
      titleClientH: t.clientHeight,
      artistBottom: +ar.bottom.toFixed(1),
      titleFont: getComputedStyle(t).fontSize,
      artistFont: getComputedStyle(a).fontSize,
    };
  });

  const worst = cards.reduce((m, c) => Math.max(m, c.artistBottom), 0);

  const tag = el('topbar-sets');
  const lab = el('topbar-sets-label');
  const num = el('topbar-sets-count');
  const tr = tag.getBoundingClientRect();
  const lr = lab.getBoundingClientRect();
  const nr = num.getBoundingClientRect();

  return {
    viewport: [innerWidth, innerHeight],
    tscale: getComputedStyle(wrap).getPropertyValue('--tscale').trim(),
    stageRows: {
      topbar: +document.querySelector('.topbar').getBoundingClientRect().height.toFixed(1),
      nowplaying: +document.querySelector('.nowplaying').getBoundingClientRect().height.toFixed(1),
      grooveWrap: +wrap.getBoundingClientRect().height.toFixed(1),
      playerbar: +el('playerbar').getBoundingClientRect().height.toFixed(1),
    },
    scroll: {
      clientH: scroll.clientHeight,
      scrollH: scroll.scrollHeight,
      clientW: scroll.clientWidth,
      scrollW: scroll.scrollWidth,
      top: +sr.top.toFixed(1),
      bottom: +sr.bottom.toFixed(1),
    },
    grooveNaturalH: +groove.getBoundingClientRect().height.toFixed(1),
    verticalOverflowPx: +(worst - sr.bottom).toFixed(1),
    cards: cards.slice(0, 3),
    setstag: {
      pill: { top: +tr.top.toFixed(1), bottom: +tr.bottom.toFixed(1), h: +tr.height.toFixed(1), w: +tr.width.toFixed(1), left: +tr.left.toFixed(1), right: +tr.right.toFixed(1) },
      label: { top: +lr.top.toFixed(1), bottom: +lr.bottom.toFixed(1), left: +lr.left.toFixed(1), right: +lr.right.toFixed(1) },
      count: { top: +nr.top.toFixed(1), bottom: +nr.bottom.toFixed(1), left: +nr.left.toFixed(1), right: +nr.right.toFixed(1) },
      labelScrollW: lab.scrollWidth,
      labelClientW: lab.clientWidth,
      tagScrollW: tag.scrollWidth,
      tagClientW: tag.clientWidth,
      topbarWraps: document.querySelector('.topbar').getBoundingClientRect().height > 60,
    },
    fontsLoaded: document.fonts ? document.fonts.status : 'n/a',
  };
};

window.SETLABEL = function (text, n) {
  el('topbar-sets-label').textContent = text;
  el('topbar-sets-count').textContent = n;
  return window.M().setstag;
};
</script>
</body>
</html>
