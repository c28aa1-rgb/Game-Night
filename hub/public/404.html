<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · Game Night</title>
<link rel="icon" type="image/svg+xml" href="/hub/favicon.svg">
<link rel="preload" href="/hub/fonts/BricolageGrotesque-Bold.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:Bricolage;src:url('/hub/fonts/BricolageGrotesque-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:Instrument;src:url('/hub/fonts/InstrumentSans-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
:root{color-scheme:dark;--table:#123d39;--shadow:#0c2c29;--ivory:#fff4dc;--butter:#f2d481;--coral:#f28c78;--lilac:#b9acd8}
*{box-sizing:border-box}
body{margin:0;background:var(--table);color:var(--ivory);font-family:Instrument,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--coral);outline-offset:7px}
.page{width:min(1440px,100%);min-height:100svh;margin:auto;padding:36px clamp(24px,5vw,80px) 28px;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font:700 20px/.95 Bricolage,system-ui,sans-serif;letter-spacing:-.04em}
.brand-mark{width:31px;height:31px;display:grid;grid-template-columns:repeat(2,7px);gap:5px;place-content:center;background:var(--ivory);border-radius:8px;transform:rotate(-8deg)}
.brand-mark i{width:7px;height:7px;border-radius:50%;background:var(--table)}
.status{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.status span{opacity:.55;padding-inline:10px}
main{flex:1;display:grid;grid-template-columns:.94fr 1.16fr;align-items:center;padding-block:50px}
.copy{position:relative;z-index:1;padding-block:20px}
.eyebrow{margin:0 0 23px;color:var(--butter);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font:700 clamp(48px,5.5vw,86px)/1.02 Bricolage,system-ui,sans-serif;letter-spacing:-.055em}
h1 span{display:block;color:var(--butter)}
.explanation{margin:27px 0 0;max-width:33ch;color:#d0dbce;font-size:clamp(16px,1.4vw,19px);line-height:1.65}
.actions{margin-top:36px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.home{display:inline-flex;align-items:center;justify-content:space-between;gap:32px;min-height:56px;padding:16px 23px;border-radius:9px;background:var(--ivory);color:var(--shadow);text-decoration:none;font:700 16px Bricolage,system-ui,sans-serif;transition:background 160ms ease,transform 160ms ease}
.home:hover{background:var(--butter);transform:translateY(-2px)}
.home svg{width:20px;height:20px}
.back{font:inherit;font-size:14px;color:var(--ivory);background:none;border:0;padding:16px 0;text-underline-offset:5px;text-decoration:underline;cursor:pointer}
.back[hidden]{display:none}
.art{margin:0 -25px 0 -5px}
.art img{width:100%;height:auto;display:block}
.footer{display:flex;justify-content:space-between;gap:20px;padding-top:22px;border-top:1px solid #ffffff24;color:#c0cec4;font-size:12px}
.footer p{margin:0}
.footer span{color:var(--butter)}
@media(min-width:1600px){main{padding-block:90px}}
@media(max-width:760px){
.page{padding:25px 24px}.brand{font-size:18px}.status{font-size:10px;letter-spacing:.08em}.status span{padding-inline:5px}
main{grid-template-columns:1fr;padding:12px 0 44px}.art{grid-row:1;width:min(460px,100%);margin:-10px auto -20px}.copy{padding:0}
.eyebrow{margin-bottom:16px;font-size:10px}h1{font-size:clamp(44px,10.8vw,70px)}.explanation{margin-top:20px;max-width:36ch}.actions{margin-top:25px}.footer{font-size:11px}
}
@media(prefers-reduced-motion:reduce){.home{transition:none}}
</style>
</head>
<body>
<div class="page">
<header class="header">
<a class="brand" href="/" aria-label="Game Night home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>GAME<br>NIGHT</span></a>
<p class="status">404 <span>/</span> Page not found</p>
</header>
<main>
<section class="copy" aria-labelledby="title">
<p class="eyebrow">A little off the board</p>
<h1 id="title">One piece<span>is missing.</span></h1>
<p class="explanation">We couldn't find this page. The link may be old or the address mistyped. Let's get you back to the games.</p>
<div class="actions">
<a class="home" href="/">Back to games<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<button class="back" id="back" type="button" hidden>Go back</button>
</div>
</section>
<figure class="art" aria-hidden="true"><img src="/hub/art/404-missing-piece.png" width="1100" height="1000" alt="" fetchpriority="high"></figure>
</main>
<footer class="footer"><p>The night is still on<span>.</span></p><p>Good company. Great games.</p></footer>
</div>
<script>
// Offer history navigation only when the previous page belongs to this site.
try {
  if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) {
    const back = document.getElementById('back');
    back.hidden = false;
    back.addEventListener('click', () => history.back());
  }
} catch (_) { /* The home link is always available. */ }
</script>
</body>
</html>
