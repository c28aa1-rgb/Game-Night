<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>That room is off the table · Game night</title>
  <meta name="description" content="The game-night page you requested could not be found." />
  <link rel="icon" type="image/svg+xml" href="/hub/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #0b0b0e;
      --paper: #ede8dc;
      --muted: #918c83;
      --line: #2b2a2e;
      --pink: #ff2e92;
      --orange: #f9680d;
      --gold: #e8b84b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Instrument Sans", system-ui, sans-serif;
    }
    main {
      width: min(680px, calc(100% - 40px));
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 92% 8%, rgba(255,46,146,.16), transparent 32%),
        radial-gradient(circle at 8% 94%, rgba(249,104,13,.14), transparent 34%),
        #111116;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }
    .kicker {
      margin: 0 0 18px;
      color: var(--gold);
      font-family: "Chivo Mono", monospace;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .number {
      margin: 0;
      color: var(--paper);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(5.5rem, 20vw, 11rem);
      line-height: .78;
      letter-spacing: -.09em;
    }
    h1 { margin: 28px 0 10px; font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.1; }
    p { max-width: 43ch; margin: 0; color: var(--muted); line-height: 1.6; }
    .swatches { display: flex; gap: 8px; margin: 28px 0; }
    .swatches i { display: block; width: 38px; height: 8px; border-radius: 99px; }
    .swatches i:nth-child(1) { background: var(--pink); }
    .swatches i:nth-child(2) { background: var(--orange); }
    .swatches i:nth-child(3) { background: var(--gold); }
    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 17px;
      border: 1px solid #5a5360;
      color: var(--paper);
      text-decoration: none;
      font-family: "Chivo Mono", monospace;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }
    a:hover, a:focus-visible { border-color: var(--pink); color: #fff; transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--pink); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Game night / wrong turn</p>
    <p class="number" aria-hidden="true">404</p>
    <h1>That page is off the table.</h1>
    <p>The room may have closed, the link may have been mistyped, or the game has moved on. The games are still waiting at the hub.</p>
    <div class="swatches" aria-hidden="true"><i></i><i></i><i></i></div>
    <a href="/">Back to game night <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
