<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Game night</title>
<meta name="description" content="Pick tonight's game." />
<link rel="icon" type="image/svg+xml" href="/hub/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" />
<style>
  :root {
    --ink: #0B0B0E;
    --raise: #131319;
    --line: #23232B;
    --text: #EDEDF2;
    --muted: #8A8A99;
    --gap: clamp(18px, 2.4vw, 30px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--text);
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 clamp(18px, 4vw, 40px) 80px;
  }

  /* --- masthead ---------------------------------------------------------- */

  .bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: clamp(20px, 3vw, 30px) 0 14px;
    border-bottom: 1px solid var(--line);
  }

  .label {
    font-family: "Chivo Mono", ui-monospace, monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  .masthead { padding: clamp(34px, 6vw, 60px) 0 clamp(30px, 5vw, 48px); }

  h1 {
    font-weight: 600;
    font-size: clamp(2rem, 4.4vw, 3.1rem);
    line-height: 1.05;
    letter-spacing: -0.025em;
    margin: 0 0 12px;
  }

  .standfirst {
    max-width: 46ch;
    color: var(--muted);
    margin: 0;
    font-size: clamp(1rem, 1.4vw, 1.1rem);
  }

  /* --- the wall ---------------------------------------------------------- */

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: var(--gap);
  }

  .card {
    --accent: var(--muted);
    display: flex;
    flex-direction: column;
    color: inherit;
    text-decoration: none;
    border-radius: 10px;
    transition: transform 260ms cubic-bezier(.2,.7,.3,1), opacity 260ms ease, filter 260ms ease;
  }

  .frame {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 10px;
    background: var(--raise);
    border: 1px solid var(--line);
  }

  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Held just below full brightness so three loud posters can share a wall. */
    filter: brightness(0.88);
    transition: transform 420ms cubic-bezier(.2,.7,.3,1), filter 260ms ease;
  }

  /* The accent bar draws itself across the foot of the poster on approach. */
  .frame::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 320ms cubic-bezier(.2,.7,.3,1);
  }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 5px 9px 4px;
    border-radius: 4px;
    background: rgba(11, 11, 14, 0.82);
    border-left: 2px solid var(--accent);
    backdrop-filter: blur(6px);
    font-family: "Chivo Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text);
  }

  .meta { padding: 14px 2px 0; }

  .tagline {
    margin: 0 0 8px;
    font-size: 0.98rem;
    line-height: 1.45;
  }

  .players {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .play {
    font-family: "Chivo Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 240ms ease, transform 240ms ease;
  }

  /* The spotlight: pointing at one poster steps the others back. */
  @media (hover: hover) {
    .wall:hover .card { opacity: 0.42; filter: saturate(0.65); }
    .wall .card:hover { opacity: 1; filter: none; transform: translateY(-5px); }
  }

  .card:hover .frame img,
  .card:focus-visible .frame img { filter: brightness(1); transform: scale(1.035); }

  .card:hover .frame::after,
  .card:focus-visible .frame::after { transform: scaleX(1); }

  .card:hover .play,
  .card:focus-visible .play { opacity: 1; transform: none; }

  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 5px;
    opacity: 1;
    filter: none;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  footer {
    margin-top: clamp(40px, 6vw, 64px);
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  footer code { font-family: "Chivo Mono", ui-monospace, monospace; color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
    .card:hover .frame img { transform: none; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <p class="label">Game night</p>
      <p class="label"><!--COUNT--></p>
    </div>

    <header class="masthead">
      <h1>What are we playing?</h1>
      <p class="standfirst">Pick one, then get everyone looking at the same screen.</p>
    </header>

    <nav class="wall">
      <!--TILES-->
    </nav>

    <footer>
      <p class="label">Another game goes in <code>games/registry.js</code></p>
    </footer>
  </div>
</body>
</html>
