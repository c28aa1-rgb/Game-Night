<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101b2a" />
  <title>Herd Mentality</title>
  <link rel="icon" href="/herd-mentality/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/herd-mentality/theme.css" />
  <link rel="stylesheet" href="/herd-mentality/start.css" />
</head>
<body>
  <main class="start">
    <section class="start__panel">
      <a class="start__back" href="/">&larr; Game night</a>
      <div class="brand" aria-label="Herd Mentality"><span>Herd</span><b>Mentality</b></div>
      <span class="kicker">Think like the crowd</span>
      <h1>Match minds.<br />Build your herd.</h1>
      <p>Everyone answers the same question in secret. Match the most popular answer to earn a cow. Stand alone and the Pink Cow blocks your win.</p>
      <div class="start__facts"><span>4-12 players</span><span>TV + phones</span><span>20-30 min</span></div>
      <div class="start__actions">
        <a class="primary" href="/herd-mentality/tv">Start on the TV</a>
        <form class="joinform" id="join-form">
          <label for="room-code">Already have a room?</label>
          <input id="room-code" name="room" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="HERD" aria-label="Room code" />
          <button type="submit">Join</button>
        </form>
        <a class="rules-video-link" href="https://www.youtube.com/watch?v=_rxOJ7Gt3FY" target="_blank" rel="noopener noreferrer" aria-label="Watch Herd Mentality rules on YouTube (opens in a new tab)">Watch how to play</a>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('join-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var code = document.getElementById('room-code').value.trim().toUpperCase();
      if (code) window.location.assign('/herd-mentality/play?room=' + encodeURIComponent(code));
    });
  </script>
</body>
</html>
