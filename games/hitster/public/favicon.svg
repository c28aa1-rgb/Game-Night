<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hitster">
  <!--
    The game in one mark: a card held over the gap it has to go in.

    Not a record. Every music app is a record, and a disc only says "this
    plays songs" when the thing worth saying is "you have to guess where it
    goes". So the turn is the mark instead — two cards already on the
    timeline, a gap between them, and the one in your hand waiting above it.

    Drawn in Arctic Frost's own tokens rather than the printed game's navy
    and gold: the ground is the theme's ink, the rule is its accent, and the
    card in play is the warm amber this theme already reserves for the thing
    that is happening right now.

    Four shapes, no hairlines, and the only gap that matters is 3px wide at
    full size — which is what keeps it legible once a browser has shrunk it
    to 16. Earlier drafts sat the amber card down in the row with the others
    and it read as a bar chart.
  -->
  <rect width="32" height="32" rx="7" fill="#1b2a3f"/>

  <!-- The timeline. -->
  <rect x="4" y="26" width="24" height="2.2" rx="1.1" fill="#4a6fa5"/>

  <!-- Already placed, with the slot open between them. -->
  <rect x="5"    y="14.5" width="6.5" height="11.5" rx="1.2" fill="#e2ecf9"/>
  <rect x="20.5" y="14.5" width="6.5" height="11.5" rx="1.2" fill="#e2ecf9"/>

  <!-- In your hand. -->
  <rect x="12.75" y="3" width="6.5" height="9" rx="1.2" fill="#e08a3c"/>
</svg>
